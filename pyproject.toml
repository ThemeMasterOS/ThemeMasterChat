[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thememasterchat"
version = "0.1.0.1"
description = "a python library for fetching youtube live chat (fork of pytchat-ng, imports as pytchat)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    {name = "Theme Master"},
]
keywords = ["youtube", "livechat", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "httpx[http2]",
]

[project.optional-dependencies]
test = [
    "pytest-mock",
    "pytest-httpx",
]

[project.urls]
Homepage = "https://github.com/ThemeMasterOS/ThemeMasterChat"

[tool.setuptools.packages.find]
exclude = ["tests*", "testrun*"]
